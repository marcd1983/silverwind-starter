---
Name: myproject
---
SilverStripe\Core\Manifest\ModuleManifest:
  project: app

# UTF8MB4 has limited support in older MySQL versions.
# Remove this configuration if you experience issues.
---
Name: myproject-database
---
SilverStripe\ORM\Connect\MySQLDatabase:
  connection_charset: utf8mb4
  connection_collation: utf8mb4_unicode_ci
  charset: utf8mb4
  collation: utf8mb4_unicode_ci

---
Name: app-asset-mimes
After:
  - '#coreconfig'
---
SilverStripe\Assets\File:
  # Let these extensions through globally
  allowed_extensions:
    - avif
    - webp
    - svg

  # Make them count as "images" so UploadField->setAllowedFileCategories('image/supported') works
  app_categories:
    'image/supported':
      - avif
      - webp
      - svg

SilverStripe\Assets\MimeValidator:
  # Teach the validator their mime-types
  extra_mime_types:
    avif: 'image/avif'
    webp: 'image/webp'
    svg:  'image/svg+xml'