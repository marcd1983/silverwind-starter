name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP lint, coding standard, tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: silverwind
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      SS_DATABASE_CLASS: MySQLDatabase
      SS_DATABASE_SERVER: 127.0.0.1
      SS_DATABASE_PORT: 3306
      SS_DATABASE_NAME: silverwind
      SS_DATABASE_USERNAME: root
      SS_DATABASE_PASSWORD: root
      SS_DEFAULT_ADMIN_USERNAME: admin
      SS_DEFAULT_ADMIN_PASSWORD: ci-only-password
      SS_ENVIRONMENT_TYPE: dev
      MAILER_DSN: 'null://null'
      # Optional repo secret: a read-only GitHub token avoids API rate limits
      COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, gd, zip, bcmath, mysqli, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHP syntax
        run: find app/src app/tests -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Coding standard
        run: vendor/bin/phpcs -q --report=summary

      - name: Build database
        run: |
          vendor/bin/sake db:build --flush
          # New tables appear on the second build (see README)
          vendor/bin/sake db:build

      - name: PHPUnit
        run: vendor/bin/phpunit
